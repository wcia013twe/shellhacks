<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eye Tracking Attention Analyzer</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
        background: #181c24;
        min-width: 320px;
        min-height: 220px;
        color: #e2e6f3;
      }
      h2 {
        color: #7ecfff;
        font-size: 18px;
        margin-bottom: 10px;
      }
      .dev-info {
        margin-bottom: 18px;
        color: #c7d0e6;
        font-size: 13px;
      }
      table.modern-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        margin-top: 10px;
        background: #23283a;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.32);
        font-size: 14px;
        letter-spacing: 0.01em;
      }
      .modern-table th,
      .modern-table td {
        padding: 10px 14px;
        text-align: center;
        border-bottom: 1px solid #31374a;
        transition: background 0.2s;
      }
      .modern-table th {
        background: #23283a;
        color: #aee7ff;
        font-weight: 700;
        font-size: 13px;
        border-bottom: 2px solid #3a415a;
      }
      .modern-table tr:last-child td {
        border-bottom: none;
      }
      .modern-table tbody tr:hover td {
        background: #2e3448;
      }
      .modern-table td span {
        font-size: 13px;
      }
      .importance-badge {
        background: #1e90ff;
        color: #fff;
        padding: 2px 10px;
        border-radius: 6px;
        font-weight: 600;
        letter-spacing: 0.01em;
        display: inline-block;
        min-width: 48px;
      }
      .modern-btn {
        background: linear-gradient(90deg, #1e90ff 0%, #7ecfff 100%);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 10px 28px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.02em;
        box-shadow: 0 2px 8px rgba(30, 144, 255, 0.15);
        cursor: pointer;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        margin-bottom: 12px;
      }
      .modern-btn:hover,
      .modern-btn:focus {
        background: linear-gradient(90deg, #339dff 0%, #aee7ff 100%);
        color: #23283a;
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 4px 16px rgba(30, 144, 255, 0.22);
        outline: none;
      }
    </style>
  </head>
  <body>
    <div>
      <h2>Attention Report (Developer View)</h2>
      <button class="modern-btn" id="recordBtn">
        Record
      </button>
    </div>

    <div id="report-table"></div>
    <script src="reportData.js"></script>
  </body>
</html>
